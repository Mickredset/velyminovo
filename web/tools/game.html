<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретная страница | Velyminovo Game</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --canvas-bg: #0f0f1a;
            --snake-color: #00ff88;
            --food-color: #ff0055;
            --text-color: #ffffff;
            --accent-color: #ff0055;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        p {
            margin-bottom: 20px;
            color: #aaaaaa;
            font-size: 14px;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.15);
            border: 2px solid var(--snake-color);
            border-radius: 4px;
        }

        canvas {
            background-color: var(--canvas-bg);
            display: block;
        }

        #score-board {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        #controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            background-color: transparent;
            border: 2px solid var(--snake-color);
            color: var(--snake-color);
            font-size: 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            background-color: var(--snake-color);
            color: var(--bg-color);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--food-color);
        }

        #game-over h2 {
            margin: 0 0 10px 0;
            font-size: 28px;
        }

        #restart-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: var(--food-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #restart-btn:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Добро пожаловать, Саша!</h1>
    <p>Секретный уровень разблокирован. Продолжи игру прямо в браузере.</p>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="game-over">
            <h2>Игра окончена!</h2>
            <p style="color: white; margin: 0;">Твой счет: <span id="final-score">0</span></p>
            <button id="restart-btn" onclick="resetGame()">Играть снова</button>
        </div>
    </div>

    <div id="score-board">Счет: <span id="score">0</span></div>

    <!-- Экранные кнопки для мобильных устройств -->
    <div id="controls">
        <button class="btn btn-up" ontouchstart="changeDirection('UP')" onclick="changeDirection('UP')">▲</button>
        <button class="btn btn-left" ontouchstart="changeDirection('LEFT')" onclick="changeDirection('LEFT')">◄</button>
        <button class="btn btn-down" ontouchstart="changeDirection('DOWN')" onclick="changeDirection('DOWN')">▼</button>
        <button class="btn btn-right" ontouchstart="changeDirection('RIGHT')" onclick="changeDirection('RIGHT')">►</button>
    </div>

    <div class="footer">Velyminovo Game Tools &copy; 2026</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over');

        const GRID_SIZE = 20;
        const CELL_SIZE = canvas.width / GRID_SIZE; // 20px

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let score = 0;
        let gameRunning = true;
        let gameLoop;

        function drawRect(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }

        function drawGame() {
            // Очистка canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем змейку
            snake.forEach((segment, index) => {
                // Голова чуть ярче или отличается, если хотите, но пока оставим единый стиль как в RenPy
                drawRect(segment.x, segment.y, '#00ff88');
            });

            // Рисуем еду
            drawRect(food.x, food.y, '#ff0055');
        }

        function updateGame() {
            if (!gameRunning) return;

            direction = nextDirection;
            const head = {x: snake[0].x, y: snake[0].y};

            if (direction === 'UP') head.y -= 1;
            else if (direction === 'DOWN') head.y += 1;
            else if (direction === 'LEFT') head.x -= 1;
            else if (direction === 'RIGHT') head.x += 1;

            // Проверка столкновения со стенами
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                endGame();
                return;
            }

            // Проверка столкновения с собой
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Проверка еды
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreElement.textContent = score;
                placeFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function placeFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            food = newFood;
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            finalScoreElement.textContent = score;
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            food = {x: 15, y: 15};
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            score = 0;
            scoreElement.textContent = score;
            gameRunning = true;
            gameOverScreen.style.display = 'none';
            placeFood();
            drawGame();
            clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, 200); // 200ms = 5 FPS, как в RenPy
        }

        function changeDirection(newDir) {
            if (!gameRunning) return;
            if (newDir === 'UP' && direction !== 'DOWN') nextDirection = 'UP';
            else if (newDir === 'DOWN' && direction !== 'UP') nextDirection = 'DOWN';
            else if (newDir === 'LEFT' && direction !== 'RIGHT') nextDirection = 'LEFT';
            else if (newDir === 'RIGHT' && direction !== 'LEFT') nextDirection = 'RIGHT';
        }

        // Управление с клавиатуры
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') changeDirection('UP');
            else if (e.key === 'ArrowDown') changeDirection('DOWN');
            else if (e.key === 'ArrowLeft') changeDirection('LEFT');
            else if (e.key === 'ArrowRight') changeDirection('RIGHT');
        });

        // Запуск игры
        resetGame();
    </script>
</body>
</html>
